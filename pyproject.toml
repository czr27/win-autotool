[project]
name = "autotool"
version = "0.1.0"
description = "Windows desktop UI automation toolbox with floating GUI, smart control locators, and parameterized CLI execution."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.7.0",
    "uiautomation>=2.0.20",
    "comtypes>=1.4.0",
    "psutil>=6.0.0",
    "pydantic>=2.7.0",
    "click>=8.1.7",
    "opencv-python-headless>=4.10.0",
    "mss>=9.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[project.scripts]
autotool = "autotool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
